name: GitHub Actions Workshop
on:
   workflow_dispatch:
jobs:
   explore:
      runs-on: ubuntu-latest
      steps:
         # uses: calls a Marketplace action — this one clones your repo
         - name: Checkout code
           uses: actions/checkout@v4
         - name: Explore the repository
           run: |
             echo "Runner directory: $PWD"
             echo "Repository files:"
             find . -maxdepth 2 -type f | sort
